<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Practice Pro</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #333; }
    h1 { text-align: center; color: #222; margin-bottom: 20px; }
    .container { max-width: 480px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    button { 
      width: 100%; padding: 16px; margin: 8px 0; font-size: 18px; 
      cursor: pointer; border-radius: 12px; border: 1px solid #ddd; 
      background-color: white; transition: 0.2s; font-weight: 500;
    }
    button:active { background-color: #eee; transform: scale(0.98); }
    
    .btn-portfolio { background-color: #007bff; color: white; border: none; }
    .btn-rules { background-color: #6c757d; color: white; border: none; }
    .btn-sheet { background-color: #34a853; color: white; border: none; }
    .btn-custom { background-color: #9c27b0; color: white; border: none; }
    .btn-fun { background-color: #fbbc04; color: #222; border: none; }
    .btn-risk { background-color: #c43d4b; color: white; border: none; }
    .btn-trivia { background-color: #087f8c; color: white; border: none; }
    
    .question { font-size: 24px; text-align: center; margin: 24px 0; font-weight: bold; min-height: 60px; line-height: 1.4; }
    .answer { font-size: 28px; text-align: center; color: #d93025; margin: 16px 0; display: none; font-weight: bold; border-top: 1px solid #eee; padding-top: 10px; }
    .timer { text-align: center; font-size: 18px; color: #666; font-weight: bold; }
    .loading { font-style: italic; color: #888; text-align: center; display: none; margin-top: 10px; }
    .scorecard-wrap { overflow-x: auto; margin-top: 12px; }
    .scorecard { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 18px; }
    .scorecard th, .scorecard td { border: 1px solid #ddd; padding: 10px 6px; text-align: center; }
    .scorecard th { background: #f8f9fa; font-size: 13px; color: #555; }
    .scorecard td { font-weight: 700; }
    
    .rules-list { text-align: left; font-size: 15px; line-height: 1.6; }
    .rules-list h3 { color: #007bff; margin-top: 15px; border-bottom: 2px solid #f0f0f0; }
    .rules-list ul { padding-left: 20px; }
    .rule-answer { white-space: pre-line; margin-bottom: 18px; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <div id="menu">
    <h1>Math Practice</h1>
    <button class="hidden" onclick="startMode('m12')">Multiplication 2–12</button>
    <button onclick="startMode('m2x1')">2-Digit × 1-Digit</button>
    <button onclick="startMode('m2x2')">2-Digit × 2-Digit</button>
    <button onclick="startMode('add3')">3-Digit Addition</button>
    <button onclick="startMode('sub3')">3-Digit Subtraction</button>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
    <button class="btn-portfolio" onclick="startMode('portfolio')">📈 Portfolio Math</button>
    <button class="btn-risk" onclick="startSheetMode('risk')">Risk</button>
    <button class="btn-custom" onclick="startSheetMode('custom')">Custom Math</button>
    <button class="btn-trivia" onclick="startSheetMode('trivia')">Trivia</button>
    <button class="btn-fun" onclick="startMode('fun')">Fun</button>
    <button class="btn-rules" onclick="showRules()">📖 Rules</button>
    <div id="loadingMsg" class="loading">Fetching questions...</div>
    
    <button class="btn-sheet" onclick="window.open('https://docs.google.com/spreadsheets/d/e/2PACX-1vT4Dugmd2CtGnRreZoVHbDqlNiWi6t-xxMgIvoyU8KW1ueQxtL3TiI9YKuHcIjXNSd_Zkqf8V6VxaeE/pubhtml', '_blank')">
      📊 Open Google Sheet
    </button>
  </div>

  <div id="rulesArea" class="card hidden">
    <h2>Rules</h2>
    <div class="rules-list" id="rulesList"></div>
    <button onclick="hideRules()">Back to Menu</button>
  </div>

  <div id="questionArea" class="card hidden">
    <div class="timer" id="timer">Time: --</div>
    <div class="question" id="question"></div>
    <div class="answer" id="answer"></div>
    <button onclick="showAnswer()" style="background-color: #4285f4; color: white; border: none;">Show Answer</button>
    <button onclick="nextQuestion()">Next Question</button>
    <button onclick="backToMenu()" style="background-color: #eee;">Back to Menu</button>
  </div>
</div>

<script>
  let currentMode = null, countdown = null, timeLeft = 0, sheetQuestions = [], isSheetMode = false;

  const modes = {
    m12: { minA: 2, maxA: 12, minB: 2, maxB: 12, op: '×', time: 8 },
    m2x1: { minA: 10, maxA: 99, minB: 2, maxB: 9, op: '×', time: 10 },
    m2x2: { minA: 10, maxA: 99, minB: 10, maxB: 99, op: '×', time: 12 },
    add3: { minA: 100, maxA: 999, minB: 100, maxB: 999, op: '+', time: 15 },
    sub3: { minA: 100, maxA: 999, minB: 100, maxB: 999, op: '-', time: 15 }
  };

  const publishedSheetBase = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4Dugmd2CtGnRreZoVHbDqlNiWi6t-xxMgIvoyU8KW1ueQxtL3TiI9YKuHcIjXNSd_Zkqf8V6VxaeE/pub';
  const sheetTabs = {
    custom: { gid: '0', label: 'Custom Math' },
    risk: { gid: '1461466739', label: 'Risk' },
    trivia: { gid: '2088230511', label: 'Trivia' },
    rules: { gid: '1089592861', label: 'Rules' }
  };

  function parseCsv(data) {
    const rows = [];
    let row = [], field = '', inQuotes = false;

    for (let i = 0; i < data.length; i++) {
      const char = data[i];
      if (char === '"') {
        if (inQuotes && data[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (char === ',' && !inQuotes) {
        row.push(field); field = '';
      } else if ((char === '\n' || char === '\r') && !inQuotes) {
        if (char === '\r' && data[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else {
        field += char;
      }
    }

    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function getQuestionRows(rows) {
    const headerIndex = rows.findIndex(row => row[0]?.trim().toLowerCase() === 'question');
    const dataRows = headerIndex >= 0 ? rows.slice(headerIndex + 1) : rows;
    return dataRows
      .map(row => ({ q: row[0]?.trim(), a: row[1]?.trim() }))
      .filter(item => item.q && item.q.toLowerCase() !== 'question');
  }

  async function fetchSheetItems(tabKey) {
    const tab = sheetTabs[tabKey];
    const response = await fetch(`${publishedSheetBase}?gid=${tab.gid}&single=true&output=csv`);
    if (!response.ok) throw new Error(`Unable to load ${tab.label}`);
    return getQuestionRows(parseCsv(await response.text()));
  }

  async function showRules() {
    const loading = document.getElementById('loadingMsg');
    loading.textContent = 'Fetching Rules...'; loading.style.display = 'block';
    try {
      const rules = await fetchSheetItems('rules');
      const rulesList = document.getElementById('rulesList');
      rulesList.innerHTML = rules.map(rule =>
        `<h3>${escapeHtml(rule.q)}</h3>${rule.a ? `<div class="rule-answer">${escapeHtml(rule.a)}</div>` : ''}`
      ).join('');
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('rulesArea').classList.remove('hidden');
    } catch (error) {
      alert('Error accessing the Rules sheet.');
    } finally {
      loading.style.display = 'none'; loading.textContent = 'Fetching questions...';
    }
  }

  function hideRules() { document.getElementById('rulesArea').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden'); }

  async function startSheetMode(tabKey) {
    const loading = document.getElementById('loadingMsg');
    loading.textContent = `Fetching ${sheetTabs[tabKey].label} questions...`;
    loading.style.display = 'block';
    try {
      sheetQuestions = await fetchSheetItems(tabKey);
      if (sheetQuestions.length > 0) {
        isSheetMode = true; currentMode = null;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('questionArea').classList.remove('hidden');
        nextQuestion();
      } else { alert(`No questions found in ${sheetTabs[tabKey].label}.`); }
    } catch (error) {
      alert(`Error accessing the ${sheetTabs[tabKey].label} sheet.`);
    } finally {
      loading.style.display = 'none'; loading.textContent = 'Fetching questions...';
    }
  }

  function generatePortfolioQuestion() {
    const type = Math.floor(Math.random() * 3); // 0: Scaling, 1: %/Bps, 2: Complex P&L
    const units = [{s:'k',v:1e3}, {s:'m',v:1e6}, {s:'b',v:1e9}];
  
    if (type === 0) {
      // 1. Variable Digit Scaling (e.g., 8m vs 75b)
      const baseIdx = Math.random() > 0.5 ? 2 : 1; 
      const uBase = units[baseIdx];
      const uExp = units[baseIdx - 1];
      
      // Vary digits: 1-9, 10-99, or 100-999
      const amtExp = Math.floor(Math.random() * 998) + 1;
      const amtBase = Math.floor(Math.random() * 998) + 1;
      
      const q = `Exposure: ${amtExp}${uExp.s}<br>GMV: ${amtBase}${uBase.s}<br><br>Basis points?`;
      const a = `${((amtExp / amtBase) * 10).toFixed(2)} bps`;
      return { q, a };
  
    } else if (type === 1) {
      // 2. Percent & Bps of GMV
      const isBps = Math.random() > 0.5;
      const rate = (Math.floor(Math.random() * 17) + 2) / 2; // 1.0 to 9.0 in 0.5 increments
      const unit = units[Math.floor(Math.random() * 3)];
      const gmv = [10, 20, 50, 100, 250, 500][Math.floor(Math.random() * 6)];
      
      const q = isBps 
        ? `${rate * 100} bps of ${gmv}${unit.s} GMV?<br>(Dollar amount)`
        : `${rate}% of ${gmv}${unit.s} GMV?<br>(Dollar amount)`;
      
      const rawVal = gmv * (rate / 100);
      // Formatting: if result is < 1, convert to smaller unit
      const a = rawVal >= 1 ? `${rawVal.toFixed(2)}${unit.s}` : `${(rawVal * 1000).toFixed(0)}${units[units.indexOf(unit)-1].s}`;
      return { q, a };
  
    } else {
      // 3. Complex P&L: GMV, Weight, Z-Score, Factor Move
      const gmvs = [1, 1.5, 2]; // In Billions
      const weights = [0.005, 0.01, 0.025]; // 0.5%, 1%, 2.5%
      const zs = [1, 1.5, 2.5];
      const moves = [0.01, 0.02, 0.05]; // 1%, 2%, 5%
  
      const g = gmvs[Math.floor(Math.random() * gmvs.length)];
      const w = weights[Math.floor(Math.random() * weights.length)];
      const z = zs[Math.floor(Math.random() * zs.length)];
      const m = moves[Math.floor(Math.random() * moves.length)];
  
      const q = `GMV: $${g}b | Weight: ${(w*100).toFixed(1)}%<br>Z-score: ${z} | Factor Move: ${(m*100).toFixed(0)}%<br><br>Calc: Exp, PnL, & GMV Ret`;
      
      // Calculations
      const exposure = g * 1000 * w * z; // in Millions
      const pnl = exposure * m; // in Millions
      const retBps = (pnl / (g * 1000)) * 10000;
  
      const a = `Exp: $${exposure.toFixed(1)}m | PnL: $${pnl.toFixed(2)}m | Ret: ${retBps.toFixed(1)} bps`;
      return { q, a };
    }
  }

  function generateGolfScorecardQuestion() {
    const scores = Array.from({ length: 9 }, () => Math.floor(Math.random() * 5) + 3);
    const holes = scores.map((_, i) => `<th>H${i + 1}</th>`).join('');
    const scoreCells = scores.map(score => `<td>${score}</td>`).join('');
    return {
      q: `Add the golf scorecard:<div class="scorecard-wrap"><table class="scorecard"><thead><tr>${holes}</tr></thead><tbody><tr>${scoreCells}</tr></tbody></table></div>`,
      a: scores.reduce((sum, score) => sum + score, 0)
    };
  }

  const funQuestionGenerators = [
    generateGolfScorecardQuestion
  ];

  function generateFunQuestion() {
    const generator = funQuestionGenerators[Math.floor(Math.random() * funQuestionGenerators.length)];
    return generator();
  }

  function startMode(modeKey) {
    isSheetMode = false; currentMode = modeKey;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('questionArea').classList.remove('hidden');
    nextQuestion();
  }

  function nextQuestion() {
    clearInterval(countdown);
    document.getElementById('answer').style.display = 'none';
    let q, a, time = 15;

    if (currentMode === 'portfolio') {
      const p = generatePortfolioQuestion(); q = p.q; a = p.a; time = 20;
    } else if (currentMode === 'fun') {
      const p = generateFunQuestion(); q = p.q; a = p.a; time = 20;
    } else if (isSheetMode) {
      const item = sheetQuestions[Math.floor(Math.random() * sheetQuestions.length)];
      q = escapeHtml(item.q).replace(/\n/g, '<br>'); a = item.a;
    } else {
      const m = modes[currentMode];
      let v1 = Math.floor(Math.random() * (m.maxA - m.minA + 1)) + m.minA;
      let v2 = Math.floor(Math.random() * (m.maxB - m.minB + 1)) + m.minB;
      if (m.op === '-' && v2 > v1) [v1, v2] = [v2, v1];
      q = `${v1} ${m.op} ${v2}`;
      a = (m.op === '×') ? v1 * v2 : (m.op === '+') ? v1 + v2 : v1 - v2;
      time = m.time;
    }

    document.getElementById('question').innerHTML = q;
    document.getElementById('answer').textContent = a;
    startTimer(time);
    speak(stripHtml(q));
  }

  function startTimer(s) {
    timeLeft = s; document.getElementById('timer').textContent = `Time: ${timeLeft}`;
    countdown = setInterval(() => {
      timeLeft--; document.getElementById('timer').textContent = `Time: ${timeLeft}`;
      if (timeLeft <= 0) { clearInterval(countdown); document.getElementById('timer').textContent = "Time Up!"; }
    }, 1000);
  }

  function showAnswer() { document.getElementById('answer').style.display = 'block'; }
  function backToMenu() { clearInterval(countdown); document.getElementById('questionArea').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden'); }
  function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text ?? ''; return div.innerHTML; }
  function stripHtml(html) { const div = document.createElement('div'); div.innerHTML = html; return div.textContent || div.innerText || ''; }
  function speak(t) { const u = new SpeechSynthesisUtterance(t); u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }
</script>
</body>
</html>
